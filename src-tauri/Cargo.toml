[package]
name = "chatly"
version = "0.1.0"
description = "Instagram, Facebook and Telegram in a locked, encrypted macOS app"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Boldbayar/chatly"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
cookie = "0.18"

argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSData"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }
block2 = "0.6"
security-framework = "3"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
